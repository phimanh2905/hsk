<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê học tập | Nhai HSK</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="js/shell.js" defer></script>
  <script src="js/data/vocab.js" defer></script>
  <script src="js/review.js" defer></script>
</head>
<body>
  <div data-shell></div>
  <main class="mx-auto max-w-3xl px-4 py-6">
    <section class="mb-6">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Thống kê học tập</h1>
      <p class="text-[var(--nhai-muted)]">Theo dõi tiến độ và kế hoạch ôn tập của bạn — ôn đủ chu kỳ 21 ngày, kiến thức sẽ được nạp vào trí nhớ dài hạn.</p>
    </section>

    <!-- Tabs -->
    <div id="tabs" class="flex gap-2 mb-5">
      <button type="button" data-tab="vocab" class="btn-main px-4 py-2 text-sm">Từ vựng</button>
      <button type="button" data-tab="grammar" class="btn-ghost px-4 py-2 text-sm">Ngữ pháp</button>
    </div>

    <!-- 6 ô thống kê -->
    <section id="stats" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="due">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Cần ôn</div>
      </div>
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="new">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Mới thêm</div>
      </div>
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="learning">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Đang học</div>
      </div>
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="recent">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Mới thuộc (&lt; 21 ngày)</div>
      </div>
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="learned">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Đã thuộc (dài hạn)</div>
      </div>
      <div class="card shadow-neo p-4 text-center">
        <div class="text-2xl font-extrabold text-[var(--nhai-main)]" data-stat="total">0</div>
        <div class="text-xs font-semibold text-[var(--nhai-muted)] mt-1">Tổng đã học qua</div>
      </div>
    </section>

    <!-- Danh sách thẻ / trạng thái rỗng (render bởi js/review.js) -->
    <section id="card-list" class="space-y-3 mb-6"></section>
    <section id="empty-state" class="mb-6"></section>

    <p class="text-xs text-[var(--nhai-muted)] text-center py-4">Nhai tiếng Trung mỗi ngày — facebook.com/groups/nhaihsk</p>
  </main>
</body>
</html>
