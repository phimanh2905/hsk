<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hanzi — 汉字工坊 Hanzi Studio</title>
<script>try{var t=localStorage.getItem('hanzi:theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
  --bg:#FAF9F5;--surface:#f1f3f2;--elev:#ffffff;--card:#ffffff;
  --fg:#1f2a27;--body:#66756f;--faint:#8a9a94;
  --border:#e8ecea;
  --accent:#C83C32;--accent-hover:#B33229;--accent-ink:#ffffff;
  --accent-soft:#FEF2F2;
  --jade:#2D7D5B;--jade-bg:#e7f2ec;--jade-bd:#bcd9c9;
  --amber:#E68A00;--amber-soft:#FFFBEB;
  --cream:#F5F4F0;
  --shadow:0 1px 2px rgba(28,25,23,.05);
  --shadow-hover:0 2px 4px rgba(28,25,23,.06),0 10px 24px rgba(28,25,23,.08);
  --r:8px;--r-card:16px;
  --font-ui:SFMono,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-hanzi:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
.hanzi{font-family:var(--font-hanzi);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1280px;margin:0 auto;height:60px;padding:0 24px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border:1px solid var(--border);background:var(--elev);border-radius:var(--r);font-size:13px;font-weight:700;text-decoration:none;color:var(--fg)}
.crumb{font-size:14px;font-weight:800;white-space:nowrap}.crumb small{font-weight:400;color:var(--body);font-size:12px}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--amber-soft);border:1px solid #f5d78a;font-size:12.5px;font-weight:800;color:#92400e;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--elev);display:grid;place-items:center;cursor:pointer;color:var(--body);flex-shrink:0}
.page{max-width:1280px;margin:0 auto;padding:20px 24px 90px;display:flex;flex-direction:column;gap:16px}
.head h1{font-size:22px}.head h1 .hanzi{color:var(--accent)}
.head p{font-size:13px;color:var(--body);margin-top:2px}
.filterbar{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:12px 14px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);min-width:74px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:500;color:var(--body);cursor:pointer;min-height:36px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 14px;height:40px;min-width:220px}
.search input{border:0;background:transparent;outline:none;font:inherit;font-size:13px;color:var(--fg);width:100%}
.search input::placeholder{color:var(--faint)}
.pill{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--body);cursor:pointer;min-height:36px;white-space:nowrap}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.split{display:grid;grid-template-columns:42fr 58fr;gap:16px;align-items:start}
@media(max-width:1023px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-head h2{font-size:14.5px}
.panel-head span{font-size:12px;color:var(--body)}
.mode-switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.mode-switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-size:12.5px;font-weight:700;color:var(--body);cursor:pointer;min-height:44px}
.mode-switch button[aria-pressed="true"]{background:var(--elev);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--border);font-weight:700}
.cat-scroll{max-height:560px;overflow-y:auto;padding-right:8px;scrollbar-width:thin}
.catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
@media(max-width:480px){.catalog{grid-template-columns:repeat(3,1fr)}}
.zcard{position:relative;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 8px 10px;text-align:center;cursor:pointer;transition:all .18s;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
.zcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.zcard.active{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 7px 9px}
.zcard .g{font-size:34px;line-height:1.3}
.zcard .p{font-size:12px;color:var(--body)}
.zcard .c{font-size:11px;font-weight:700;color:var(--body)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--body);font-weight:700}
.pager button{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:800;color:var(--fg)}
.pager button:disabled{opacity:.4;cursor:default}
.wb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.wb-glyph{font-size:44px;line-height:1.2}
.wb-id{font-size:13px;font-weight:700}
.wb-id small{display:block;font-weight:400;color:var(--body);font-size:12px}
.py-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 16px}
.py-pill button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--body)}
.py-pill button:hover{background:var(--card);color:var(--fg)}
.decomp{font-size:12.5px;color:var(--body);background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0 0}
.decomp b{color:var(--fg)}.decomp .hanzi{color:var(--jade)}
.mode-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;margin:10px 0}
.mode-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:var(--body);cursor:pointer;min-height:44px}
.mode-tabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--border)}
.grid-box{position:relative;width:min(280px,100%);max-width:300px;aspect-ratio:1;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
@media(max-width:480px){.grid-box{width:min(280px,100%)}}
.grid-box svg{position:absolute;inset:0;width:100%;height:100%}
.st{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:13}
.st.todo{stroke:#1f2a27;opacity:.13}
.st.done{stroke:#1f2a27;opacity:1}
.st.now{stroke:var(--accent);opacity:1}
.st.hint{stroke:var(--accent);opacity:.3;stroke-dasharray:6 8}
.ink-path{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.ink-path.good{stroke:#1f2a27}
.ink-path.bad{stroke:var(--accent)}
.toolbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.toolbar[hidden]{display:none}
.tool-btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--fg)}
.tool-btn:hover{border-color:var(--body)}
.tool-btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool-btn.accent:hover{background:var(--accent-hover)}
.speed-seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.speed-seg button{border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:500;color:var(--body);cursor:pointer;min-height:36px;white-space:nowrap}
.speed-seg button[aria-pressed="true"]{background:var(--elev);color:var(--fg);font-weight:700;box-shadow:var(--shadow);border-color:var(--border)}
.tray{margin-top:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--bg)}
.tray h4{font-size:12px;font-weight:600;color:var(--body);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tray-grid{display:flex;gap:8px;flex-wrap:wrap}
.tchip{border:1px solid var(--border);background:var(--elev);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;min-height:40px;transition:all .15s}
.tchip .hanzi{font-size:16px;margin-right:4px}
.tchip small{color:var(--body);font-weight:400}
.tchip:hover{border-color:rgba(200,60,50,.6);background:var(--accent-soft)}
.tchip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tip{margin-top:8px;background:var(--amber-soft);border:1px solid #f5d78a;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--body)}
.tip b{color:var(--fg)}
.pane-tabs{display:none;position:sticky;top:60px;z-index:15;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.pane-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:var(--body);cursor:pointer;min-height:44px}
.pane-tabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
@media(max-width:1023px){
  .pane-tabs{display:flex}
  .split.stack-catalog #paneWork,.split.stack-work #paneCatalog{display:none}
  .page{padding:16px 16px 90px}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="topbar" data-od-id="studio-topbar"><div class="topbar-inner">
  <a class="back" href="index.html" data-od-id="back-home"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Trang chủ</a>
  <div class="crumb" data-od-id="studio-crumb">Hanzi Studio &nbsp;•&nbsp; <small>Luyện viết &amp; chiết tự Hán tự</small></div>
  <span class="streak" data-od-id="streak-pill">🔥 12</span>
  <button class="icon-btn" id="themeBtn" data-od-id="theme-toggle" aria-label="Chế độ sáng tối">☀️</button>
</div></header>

<main class="page">
  <div class="head" data-od-id="studio-header">
    <h1><span class="hanzi">汉字工坊</span> · Hanzi Studio</h1>
    <p>Khám phá kết cấu, thứ tự nét và rèn luyện trí nhớ cơ bắp</p>
  </div>

  <div class="filterbar" data-od-id="studio-filters">
    <div class="frow">
      <span class="flabel">Số nét</span>
      <div class="seg" id="strokeSeg" role="group" aria-label="Lọc theo số nét">
        <button data-sw="all" aria-pressed="false">Tất cả (214)</button>
        <button data-sw="12" aria-pressed="false">1–2 nét</button>
        <button data-sw="3" aria-pressed="true">3 nét</button>
        <button data-sw="4" aria-pressed="false">4 nét</button>
        <button data-sw="5" aria-pressed="false">5+ nét</button>
      </div>
      <label class="search">🔍<input id="q" type="search" placeholder="Tìm bộ thủ, nghĩa…" aria-label="Tìm bộ thủ" /></label>
    </div>
    <div class="frow">
      <span class="flabel">Phân loại</span>
      <button class="pill" data-cat="core" aria-pressed="true">50 bộ cốt lõi HSK</button>
      <button class="pill" data-cat="human" aria-pressed="false">Con người (亻, 女)</button>
      <button class="pill" data-cat="nature" aria-pressed="false">Thiên nhiên (氵, 木, 火)</button>
      <button class="pill" data-cat="animal" aria-pressed="false">Động vật (犭, 鸟)</button>
    </div>
  </div>

  <div class="pane-tabs" role="group" aria-label="Chuyển khung">
    <button id="tabCatalog" aria-pressed="true">Kho tra cứu</button>
    <button id="tabWork" aria-pressed="false">Bàn tập viết</button>
  </div>

  <div class="split stack-catalog" id="split">
    <section class="panel" id="paneCatalog" data-od-id="radical-catalog" aria-label="Kho tra cứu bộ thủ">
      <div class="panel-head"><h2>Kho tra cứu</h2><span id="catCount"></span></div>
      <div class="mode-switch" role="group" aria-label="Chế độ tra cứu" data-od-id="catalog-mode">
        <button id="modeHsk" aria-pressed="false">📚 Theo cấp độ HSK</button>
        <button id="modeRad" aria-pressed="true">🧩 214 Bộ thủ</button>
      </div>
      <div class="cat-scroll"><div class="catalog" id="catalog"></div></div>
      <div class="pager" data-od-id="catalog-pager">
        <button id="pgPrev" aria-label="Trang trước">◀</button>
        <span id="pgLabel"></span>
        <button id="pgNext" aria-label="Trang sau">▶</button>
      </div>
    </section>

    <section class="panel" id="paneWork" data-od-id="workbench" aria-label="Bàn tập viết và chiết tự">
      <div class="wb-head">
        <span class="wb-glyph hanzi" id="wbGlyph">氵</span>
        <span class="wb-id"><span id="wbName">Bộ Thủy (Nước) · 3 nét</span><small id="wbPy">shuǐ · liên quan đến chất lỏng, sông hồ</small></span>
        <span class="py-pill"><button id="wbAudio" aria-label="Phát âm">🔊</button></span>
      </div>
      <div class="decomp" id="decomp" hidden></div>
      <div class="mode-tabs" role="group" aria-label="Chế độ luyện" data-od-id="mode-tabs">
        <button id="modeWatch" aria-pressed="true">👁️ Xem bút thuận</button>
        <button id="modeDraw" aria-pressed="false">✍️ Tự luyện viết</button>
      </div>
      <div class="grid-box" data-od-id="tianzi-grid">
        <svg viewBox="0 0 300 300" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
          <rect x="4" y="4" width="292" height="292" fill="none" stroke="var(--faint)" stroke-width="1.5" rx="4"/>
          <line x1="150" y1="4" x2="150" y2="296" stroke="var(--faint)" stroke-width="1" stroke-dasharray="7 6"/>
          <line x1="4" y1="150" x2="296" y2="150" stroke="var(--faint)" stroke-width="1" stroke-dasharray="7 6"/>
          <line x1="4" y1="4" x2="296" y2="296" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 7" opacity=".7"/>
          <line x1="296" y1="4" x2="4" y2="296" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 7" opacity=".7"/>
        </svg>
        <svg id="strokeSvg" viewBox="0 0 300 300" role="img" aria-label="Hoạt họa bút thuận" style="position:absolute;inset:0;width:100%;height:100%"></svg>
        <svg id="inkSvg" viewBox="0 0 300 300" style="position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none" aria-label="Bảng tự luyện viết"></svg>
      </div>
      <div class="toolbar" id="watchBar" data-od-id="watch-controls">
        <button class="tool-btn" id="btnPrev">◀ Nét trước</button>
        <button class="tool-btn accent" id="btnReplay">↺ Phát lại</button>
        <button class="tool-btn" id="btnNext">Nét sau ▶</button>
        <div class="speed-seg" role="group" aria-label="Tốc độ hoạt họa" data-od-id="speed-switcher">
          <button data-speed="0.75" aria-pressed="false">0.75x</button>
          <button data-speed="1" aria-pressed="true">1.0x</button>
        </div>
      </div>
      <div class="toolbar" id="drawBar" data-od-id="draw-controls" hidden>
        <button class="tool-btn" id="btnClear">Xóa bảng</button>
        <button class="tool-btn" id="btnUndo">Hoàn tác</button>
        <button class="tool-btn" id="btnHint" aria-pressed="false">Gợi ý nét mờ</button>
      </div>
      <div class="tray" data-od-id="char-tray">
        <h4>Các chữ HSK chứa bộ này (Click để luyện viết):</h4>
        <div class="tray-grid" id="tray"></div>
      </div>
      <div class="tip" data-od-id="mnemonic"><b>Mẹo nhớ:</b> <span id="mTip"></span></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<span class="sr" id="srLive" aria-live="polite"></span>

<script>
(function(){
  var toast=document.getElementById('toast'),t=null;
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(t);t=setTimeout(function(){toast.classList.remove('show')},2200);document.getElementById('srLive').textContent=m;}
  function speak(x){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
  document.getElementById('themeBtn').addEventListener('click',function(){
    var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';
    r.setAttribute('data-theme',n);try{localStorage.setItem('hanzi:theme',n)}catch(e){}
    document.getElementById('themeBtn').textContent=n==='dark'?'🌙':'☀️';
  });

  // Radical library (12 items, page 1 of 6). p = stroke paths in 300-box.
  var RAD=[
    {g:'氵',py:'shuǐ',nm:'Bộ Thủy (Nước)',st:3,cat:'nature',core:1,mean:'Liên quan đến chất lỏng, sông hồ',tip:'3 chấm nước tượng trưng cho giọt nước bắn — viết từ trên xuống, chấm cuối hất nhẹ.',n:18,
     p:['M118,80 C119,88 120,96 121,104','M138,116 C139,124 140,132 141,140','M120,160 C136,156 152,148 166,136'],
     chars:[['没','méi'],['洗','xǐ'],['渴','kě'],['海','hǎi'],['汉','hàn'],['汤','tāng'],['汗','hàn']]},
    {g:'口',py:'kǒu',nm:'Bộ Khẩu (Miệng)',st:3,cat:'human',core:1,mean:'Liên quan đến miệng, lời nói, ăn uống',tip:'Khung vuông khép kín — viết sổ trước, ngang sổ sau, đáy đóng cuối.',n:26,
     p:['M110,90 C110,130 110,170 110,210','M110,90 C137,90 163,90 190,90 C190,130 190,170 190,210','M110,210 C137,210 163,210 190,210'],
     chars:[['吃','chī'],['喝','hē'],['叫','jiào'],['问','wèn']]},
    {g:'扌',py:'shǒu',nm:'Bộ Thủ (Tay)',st:3,cat:'human',core:1,mean:'Liên quan đến tay và hành động',tip:'Nét sổ – ngang – hất: gọn như bàn tay đang gạt.',n:15,
     p:['M130,70 C130,120 130,170 130,220','M130,120 C160,118 190,114 215,105','M130,150 C145,165 160,180 175,195'],

    if(!drawing)return;var pt=svgPoint(e),last=drawing._pts[drawing._pts.length-1];
    if(Math.hypot(pt.x-last.x,pt.y-last.y)<3)return;
    drawing._pts.push(pt);drawing.setAttribute('points',drawing.getAttribute('points')+' '+pt.x.toFixed(1)+','+pt.y.toFixed(1));
  });
  inkSvg.addEventListener('pointerup',function(){
    if(!drawing)return;inkPaths.push(drawing);drawing=null;
    if(hintOn)showHint();
    var d=selData();
    if(inkPaths.length===d.p.length)say('Xong '+d.p.length+' nét — chuyển câu khác hoặc phát lại để đối chiếu');
  });
  catalog.addEventListener('click',function(e){
    var r=e.target.closest('[data-rad]');if(r){selectRad(r.getAttribute('data-rad'));return;}
    var h=e.target.closest('[data-hsk]');if(h){selectHsk(h.getAttribute('data-hsk'));}
  });
  document.getElementById('tray').addEventListener('click',function(e){
    var b=e.target.closest('[data-tray]');if(b)selectHsk(b.getAttribute('data-tray'));
  });
  document.querySelectorAll('#strokeSeg button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#strokeSeg button').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');strokeF=b.getAttribute('data-sw');page=0;renderCatalog();
    });
  });
  document.querySelectorAll('.filterbar .pill').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.filterbar .pill').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');catF=b.getAttribute('data-cat');page=0;renderCatalog();
    });
  });
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();page=0;renderCatalog();});
  document.getElementById('modeRad').addEventListener('click',function(){
    catalogMode='rad';
    document.getElementById('modeRad').setAttribute('aria-pressed','true');
    document.getElementById('modeHsk').setAttribute('aria-pressed','false');
    renderCatalog();
  });
  document.getElementById('modeHsk').addEventListener('click',function(){
    catalogMode='hsk';
    document.getElementById('modeHsk').setAttribute('aria-pressed','true');
    document.getElementById('modeRad').setAttribute('aria-pressed','false');
    renderCatalog();say('Cột trái chuyển về HSK — thẻ “洗” đang active');
  });
  function showPane(w){
    document.getElementById('split').className='split '+(w==='work'?'stack-work':'stack-catalog');
    document.getElementById('tabCatalog').setAttribute('aria-pressed',w!=='work');
    document.getElementById('tabWork').setAttribute('aria-pressed',w==='work');
  }
  document.getElementById('tabCatalog').addEventListener('click',function(){showPane('catalog');});
  document.getElementById('tabWork').addEventListener('click',function(){showPane('work');});
  document.getElementById('pgPrev').addEventListener('click',function(){if(page>0){page--;renderCatalog();}});
  document.getElementById('pgNext').addEventListener('click',function(){page++;renderCatalog();});
  renderCatalog();renderHead();buildGrid();playAll();
})();
</script>
</body>
</html>
